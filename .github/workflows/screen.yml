name: 종가배팅 스크리너

on:
  schedule:
    # UTC 기준. 05:33 UTC = 14:33 KST, 05:43 UTC = 14:43 KST (평일)
    # GitHub Actions cron은 최대 10분 지연될 수 있어 2회 실행합니다.
    - cron: "33 5 * * 1-5"
    - cron: "43 5 * * 1-5"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # result.json 커밋용

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 스크리너 실행
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          MAX_PRICE: "500000"
          PREF_PRICE: "200000"
        run: python screener.py

      - name: 결과 커밋
        run: |
          git config user.name  "jongga-bot"
          git config user.email "actions@github.com"
          git add -f result.json result.md
          git diff --staged --quiet || git commit -m "screen $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
